name: Auth Service CI

on:
  pull_request:
    branches: [ "dev", "main" ]
    paths:
      - 'src/auth-service/**'

jobs:
  test-auth:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run Maven Tests
        run: mvn -B test --file src/auth-service/pom.xml