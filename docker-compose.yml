services:

  nginx:
    build: ./src/nginx
    restart: always 
    container_name: nginx
    ports:
      - "443:443"
    networks:
      - frontend_net

  # frontend:
  #   build: ./src/frontend
  #   restart: always
  #   container_name: frontend
  #   networks:
  #     - frontend_net

  auth-api:
    build: ./src/auth-service
    container_name: auth-api
    restart: always
    env_file:
      - src/.env
    networks:
      - frontend_net
      - backend_net
    depends_on:
      postgres_db:
        condition: service_healthy
        restart: true

  ats-api:
    build: ./src/ats-service
    container_name: ats-api
    networks:
      - backend_net
      - frontend_net
    env_file:
      - src/.env
    volumes:
      - ./src/ats-service:/app
      - /app/node_modules
    depends_on:
      postgres_db:
        condition: service_healthy
        restart: true

  # ai-worker:
  #   build: ./src/ai-worker
  #   container_name: ai-worker
  #   networks: 
  #     - backend_net
  #   depends_on:
  #     postgres_db:
  #       condition: service_healthy
  #       restart: true


  postgres_db:
    image: postgres:18
    restart: always
    container_name: postgres_db
    ports:
      - "5432:5432"
    networks:
      - backend_net
    env_file:
      - src/.env
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./src/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s

  adminer:
    image: adminer
    container_name: adminer
    restart: always
    ports:
      - "8080:8080"
    networks:
      - backend_net
      - frontend_net
    depends_on:
      postgres_db:
        condition: service_healthy
        restart: true


networks:
  frontend_net:
    driver: bridge     
  backend_net:
    driver: bridge



volumes:
  postgres_data:


