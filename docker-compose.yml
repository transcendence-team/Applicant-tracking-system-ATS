services:

  nginx:
    build: ./src/nginx
    restart: always 
    container_name: nginx
    ports:
      - "443:443"
    networks:
      - frontend_net

  # frontend:
  #   build: ./src/frontend
  #   restart: always
  #   container_name: frontend
  #   networks:
  #     - frontend_net

  auth-api:
    build: ./src/auth-service
    container_name: auth-api
    restart: always
    env_file:
      - .env
    networks:
      - frontend_net
      - backend_net
    depends_on:
      auth_db:
        condition: service_healthy
        restart: true

  # ats-api:
  #   build: ./src/database
  #   container_name: ats-api
  #   networks:
  #     - backend_net
  #     - frontend_net
  #   env_file:
  #     - .env
  #   volumes:
  #     - ./src/database:/app
  #     - /app/node_modules
  #   depends_on:
  #     ats_db:
  #       condition: service_healthy
  #       restart: true

  ai-worker:
    build: ./src/ai-worker
    container_name: ai-worker
    restart: always
    ports:
      # [TESTING MODE]: Exposed so you can test POST /parse from host/curl/REST client.
      # [FULL INTEGRATION]: Remove or comment out 'ports' so the AI worker remains
      # private on 'backend_net' and only accessible internally by ats-api.
      - "8000:8000"
    volumes:
      # Live reload: edits in ./src/ai-worker reflect immediately inside container
      - ./src/ai-worker:/app
      # ------------------------------------------------------------------------
      # [FULL INTEGRATION STEP 1 - SHARED RESUME STORAGE]:
      # When ats-api saves uploaded PDFs, mount the shared volume so ai-worker can read them:
      # - resume_uploads:/app/uploads
      # ------------------------------------------------------------------------
    networks:
      - backend_net
    env_file:
      - .env
    depends_on:
      - ollama
    # depends_on:
    #   ats_db:
    #     condition: service_healthy
    #     restart: true
    #   ollama:
    #     condition: service_started
    # --------------------------------------------------------------------------


  ats_db:
    image: postgres:18-alpine
    restart: always
    container_name: ats_db
    networks:
      - backend_net
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
    volumes:
      - ats_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s


  auth_db:
    image: postgres:18-alpine
    restart: always
    container_name: auth_db
    networks:
      - backend_net
    environment:
      POSTGRES_DB: ${AUTH_DB_NAME}
      POSTGRES_USER: ${AUTH_DB_USER}
      POSTGRES_PASSWORD: ${AUTH_DB_PASS}
    volumes:
      - auth_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s



  adminer:
    image: adminer
    container_name: adminer
    restart: always
    networks:
      - backend_net
      - frontend_net
    depends_on:
      auth_db:
        condition: service_healthy
        restart: true
      ats_db:
        condition: service_healthy
        restart: true

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: always
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - backend_net
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        /bin/ollama serve &
        pid=$$!
        sleep 5
        echo "🔴 Verifying / pulling llama3.2:1b..."
        ollama pull llama3.2:1b
        wait $$pid

networks:
  frontend_net:
    driver: bridge     
  backend_net:
    driver: bridge

volumes:
  auth_data:
  ats_data:
  ollama_data:


