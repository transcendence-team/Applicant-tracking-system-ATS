services:

  nginx:
    build: ./src/nginx
    volumes:
      - ./src/test-ats-service:/usr/share/nginx/html/test-ats-service:ro
    restart: always 
    container_name: nginx
    ports:
      - "443:443"
    networks:
      - frontend_net
    depends_on:
      - frontend
      - auth-api
      - ats-api

  frontend:
    build: ./src/frontend
    restart: always
    container_name: frontend
    environment:
      AUTH_API_URL: ${AUTH_API_URL:-http://auth-api:8080}
    networks:
      - frontend_net
    depends_on:
      - auth-api

  auth-api:
    build: ./src/auth-service
    container_name: auth-api
    restart: always
    environment:
      AUTH_DB_NAME: ${AUTH_DB_NAME}
      AUTH_DB_USER: ${AUTH_DB_USER}
      AUTH_DB_PASS: ${AUTH_DB_PASS}
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-7200000}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    networks:
      - frontend_net
      - backend_net
    depends_on:
      auth_db:
        condition: service_healthy
        restart: true

  ats-api:
    build:
      context: .
      dockerfile: src/ats-service/Dockerfile
    container_name: ats-api
    restart: always
    environment:
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
      AI_PARSE_URL: ${AI_PARSE_URL:-http://ai-worker:8000/parse}
      AI_TIMEOUT_MS: ${AI_TIMEOUT_MS:-60000}
      UPLOAD_DIR: /data/resumes
    networks:
      - frontend_net
      - backend_net
    volumes:
      - resume_data:/data/resumes
    depends_on:
      ats_db:
        condition: service_healthy
        restart: true
      ai-worker:
        condition: service_started

  ats-db-tools:
    build: ./src/postgres/ats-db
    profiles: ["database"]
    environment:
      DATABASE_URL: ${DATABASE_URL}
    networks:
      - backend_net
    depends_on:
      ats_db:
        condition: service_healthy
    command: ["sh", "-c", "npm run prisma:migrate:deploy && npm run prisma:seed"]

  ai-worker:
    build: ./src/ai-worker
    restart: always
    networks:
      - backend_net


  ats_db:
    image: postgres:18-alpine
    restart: always
    container_name: ats_db
    networks:
      - backend_net
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
    volumes:
      - ats_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s


  auth_db:
    image: postgres:18-alpine
    restart: always
    container_name: auth_db
    networks:
      - backend_net
    environment:
      POSTGRES_DB: ${AUTH_DB_NAME}
      POSTGRES_USER: ${AUTH_DB_USER}
      POSTGRES_PASSWORD: ${AUTH_DB_PASS}
    volumes:
      - auth_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s



  adminer:
    image: adminer
    container_name: adminer
    restart: always
    networks:
      - backend_net
      - frontend_net
    depends_on:
      auth_db:
        condition: service_healthy
        restart: true
      ats_db:
        condition: service_healthy
        restart: true

networks:
  frontend_net:
    driver: bridge     
  backend_net:
    driver: bridge

volumes:
  auth_data:
  ats_data:
  resume_data:


