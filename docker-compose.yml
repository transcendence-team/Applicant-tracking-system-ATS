services:

  nginx:
    build: ./src/nginx
    restart: always 
    container_name: nginx
    ports:
      - "443:443"
    networks:
      - frontend_net
    depends_on:
      - frontend
      - auth-api

  frontend:
    build: ./src/frontend
    restart: always
    container_name: frontend
    environment:
      AUTH_API_URL: ${AUTH_API_URL:-http://auth-api:8080}
    networks:
      - frontend_net
    depends_on:
      - auth-api

  auth-api:
    build: ./src/auth-service
    container_name: auth-api
    restart: always
    environment:
      AUTH_DB_NAME: ${AUTH_DB_NAME}
      AUTH_DB_USER: ${AUTH_DB_USER}
      AUTH_DB_PASS: ${AUTH_DB_PASS}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-7200000}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    networks:
      - frontend_net
      - backend_net
    depends_on:
      auth_db:
        condition: service_healthy
        restart: true

  ats-api:
    build: ./src/ats-service
    container_name: ats-api
    networks:
      - backend_net
      - frontend_net
    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
    volumes:
      - ./src/ats-service:/app
      - /app/node_modules
    depends_on:
      ats_db:
        condition: service_healthy
        restart: true

  # ai-worker:
  #   build: ./src/ai-worker
  #   container_name: ai-worker
  #   networks: 
  #     - backend_net
  #   depends_on:
  #     ats_db:
  #       condition: service_healthy
  #       restart: true


  ats_db:
    image: postgres:18-alpine
    restart: always
    container_name: ats_db
    networks:
      - backend_net
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
    volumes:
      - ats_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s


  auth_db:
    image: postgres:18-alpine
    restart: always
    container_name: auth_db
    networks:
      - backend_net
    environment:
      POSTGRES_DB: ${AUTH_DB_NAME}
      POSTGRES_USER: ${AUTH_DB_USER}
      POSTGRES_PASSWORD: ${AUTH_DB_PASS}
    volumes:
      - auth_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s



  adminer:
    image: adminer
    container_name: adminer
    restart: always
    networks:
      - backend_net
      - frontend_net
    depends_on:
      auth_db:
        condition: service_healthy
        restart: true
      ats_db:
        condition: service_healthy
        restart: true

networks:
  frontend_net:
    driver: bridge     
  backend_net:
    driver: bridge

volumes:
  auth_data:
  ats_data:


