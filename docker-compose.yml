services:

  nginx:
    build: ./src/nginx
    restart: always 
    container_name: nginx
    ports:
      - "443:443"
    networks:
      - frontend_net
    depends_on:
      - frontend
      - auth-api
      - ats-api

  frontend:
    build: ./src/frontend
    restart: always
    container_name: frontend
    environment:
      AUTH_API_URL: ${AUTH_API_URL:-http://auth-api:8080}
    networks:
      - frontend_net
    depends_on:
      - auth-api

  auth-api:
    build: ./src/auth-service
    container_name: auth-api
    restart: always
    environment:
      AUTH_DB_NAME: ${AUTH_DB_NAME}
      AUTH_DB_USER: ${AUTH_DB_USER}
      AUTH_DB_PASS: ${AUTH_DB_PASS}
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-7200000}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    networks:
      - frontend_net
      - backend_net
    depends_on:
      auth_db:
        condition: service_healthy
        restart: true

  ats-api:
    build: ./src/ats-service
    container_name: ats-api
    networks:
      - backend_net
      - frontend_net
    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
      ATS_SCHEMA_PATH: /ats-schema/schema.prisma
    volumes:
      - ./src/ats-service:/app
      - ./src/postgres/ats-db/prisma:/ats-schema:ro
      - /app/node_modules
    tmpfs:
      - /app/prisma
      - /app/src/generated
    command: ["sh", "-c", "npm run prisma:generate && npm run prisma:migrate:deploy && exec npm run dev"]
    depends_on:
      ats_db:
        condition: service_healthy
        restart: true

  ai-worker:
    build: ./src/ai-worker
    container_name: ai-worker
    restart: always
    # TEMPORARY: expose locally for ai.rest testing (remove before production/PR)
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      # Live reload: edits in ./src/ai-worker reflect immediately inside container
      - ./src/ai-worker:/app
      # ------------------------------------------------------------------------
      # [FULL INTEGRATION STEP 1 - SHARED RESUME STORAGE]:
      # When ats-api saves uploaded PDFs, mount the shared volume so ai-worker can read them:
      # - resume_uploads:/app/uploads
      # ------------------------------------------------------------------------
    networks:
      - backend_net
    env_file:
      - .env
    # depends_on:
    #   - ollama



  ats_db:
    image: postgres:18-alpine
    restart: always
    container_name: ats_db
    networks:
      - backend_net
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
    volumes:
      - ats_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s


  auth_db:
    image: postgres:18-alpine
    restart: always
    container_name: auth_db
    networks:
      - backend_net
    environment:
      POSTGRES_DB: ${AUTH_DB_NAME}
      POSTGRES_USER: ${AUTH_DB_USER}
      POSTGRES_PASSWORD: ${AUTH_DB_PASS}
    volumes:
      - auth_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s



  adminer:
    image: adminer
    container_name: adminer
    restart: always
    networks:
      - backend_net
      - frontend_net
    depends_on:
      auth_db:
        condition: service_healthy
        restart: true
      ats_db:
        condition: service_healthy
        restart: true

  # ollama:
  #   image: ollama/ollama:latest
  #   container_name: ollama
  #   restart: always
  #   volumes:
  #     - ollama_data:/root/.ollama
  #   networks:
  #     - backend_net
  #   entrypoint: ["/bin/sh", "-c"]
  #   command:
  #     - |
  #       /bin/ollama serve &
  #       pid=$$!
  #       sleep 5
  #       echo "🔴 Verifying / pulling llama3.2:1b..."
  #       ollama pull llama3.2:1b
  #       wait $$pid

networks:
  frontend_net:
    driver: bridge     
  backend_net:
    driver: bridge

volumes:
  auth_data:
  ats_data:
