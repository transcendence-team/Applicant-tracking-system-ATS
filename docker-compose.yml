services:

  nginx:
    build: ./src/nginx
    volumes:
      - ./src/test-ats-service:/usr/share/nginx/html/test-ats-service:ro
    restart: always 
    container_name: nginx
    ports:
      - "443:443"
    networks:
      - frontend_net
    depends_on:
      - frontend
      - auth-api
      - ats-api

  frontend:
    build: ./src/frontend
    restart: always
    container_name: frontend
    env_file:
      - .env
    networks:
      - frontend_net
    depends_on:
      - auth-api

  auth-api:
    build: ./src/auth-service
    container_name: auth-api
    restart: always
    env_file:
      - .env
    networks:
      - frontend_net
      - backend_net
    depends_on:
      auth_db:
        condition: service_healthy
        restart: true

  ats-api:
    build:
      context: .
      dockerfile: src/ats-service/Dockerfile
    restart: always
    env_file:
      - .env
    environment:
      PORT: 3000
      AI_PARSE_URL: ${AI_PARSE_URL:-http://ai-worker:8000/parse}
      AI_TIMEOUT_MS: ${AI_TIMEOUT_MS:-60000}
      UPLOAD_DIR: /data/resumes
    networks:
      - frontend_net
      - backend_net
    volumes:
      - resume_data:/data/resumes
    depends_on:
      ats_db:
        condition: service_healthy

  ats-db-tools:
    build: ./src/postgres/ats-db
    profiles: ["database"]
    env_file:
      - .env
    networks:
      - backend_net
    depends_on:
      ats_db:
        condition: service_healthy
    command: ["sh", "-c", "npm run prisma:migrate:deploy && npm run prisma:seed"]

  # ai-worker:
  #   build: ./src/ai-worker
  #   container_name: ai-worker
  #   networks: 
  #     - backend_net
  #   depends_on:
  #     ats_db:
  #       condition: service_healthy
  #       restart: true


  ats_db:
    image: postgres:18-alpine
    restart: always
    container_name: ats_db
    networks:
      - backend_net
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
    volumes:
      - ats_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s


  auth_db:
    image: postgres:18-alpine
    restart: always
    container_name: auth_db
    networks:
      - backend_net
    environment:
      POSTGRES_DB: ${AUTH_DB_NAME}
      POSTGRES_USER: ${AUTH_DB_USER}
      POSTGRES_PASSWORD: ${AUTH_DB_PASS}
    volumes:
      - auth_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s



  adminer:
    image: adminer
    container_name: adminer
    restart: always
    networks:
      - backend_net
      - frontend_net
    depends_on:
      auth_db:
        condition: service_healthy
        restart: true
      ats_db:
        condition: service_healthy
        restart: true

networks:
  frontend_net:
    driver: bridge     
  backend_net:
    driver: bridge

volumes:
  auth_data:
  ats_data:
  resume_data:


