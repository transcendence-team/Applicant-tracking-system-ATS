spring:
  application:
    name: auth-service
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://auth_db:5432/${POSTGRES_AUTH_DB:${AUTH_DB_NAME:auth_service_db}}
    username: ${POSTGRES_USER:${AUTH_DB_USER:auth_admin}}
    password: ${POSTGRES_PASSWORD:${AUTH_DB_PASS:auth_password123}}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

#     When Spring Boot boots up, Hibernate scans all classes annotated with @Entity in com.ats.auth.
# It finds User.java
# It asks PostgreSQL: "Does a table named users exist in auth_db?"
# Since it didn't exist, Hibernate generated and executed the raw SQL DDL automatically:

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: ${JWT_EXPIRATION_MS:7200000}
