spring:
  application:
    name: auth-service
  mongodb:
    uri: mongodb://${AUTH_DB_USER}:${AUTH_DB_PASS}@auth_db:27017/${AUTH_DB_NAME}?authSource=admin
    representation:
      uuid: standard
  data:
    mongodb:
      uri: mongodb://${AUTH_DB_USER}:${AUTH_DB_PASS}@auth_db:27017/${AUTH_DB_NAME}?authSource=admin
      auto-index-creation: true
      uuid-representation: standard

jwt:
  private-key: ${JWT_PRIVATE_KEY}
  public-key: ${JWT_PUBLIC_KEY}
  expiration-ms: ${JWT_EXPIRATION_MS:7200000}

admin:
  email: ${ADMIN_EMAIL}
  password: ${ADMIN_PASSWORD}
