events
{
    worker_connections 1024;
}

http {
    
    # include       mime.types;
    # default_type  application/octet-stream;

    server
    {
        
        listen 443 ssl;
        server_name localhost;
 
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_certificate /etc/ssl/certs/ats.crt;
        ssl_certificate_key /etc/ssl/private/ats.key;

        # Frontend 
        location / {
            proxy_pass http://frontend:3000;
            
            # Required for Next.js React hydration and WebSockets (HMR)
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            
            # Preserve the original host and secure protocols for Auth
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Auth API  
        location /api/auth/ {
            proxy_pass http://auth-api:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # 4. Database Admin UI (Catches /adminer/ requests)
        location /adminer/ {
            # The trailing slash after 8080 is CRITICAL here!
            proxy_pass http://adminer:8080/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # ATS API  
        # location /api/ats/ {
        #     proxy_pass http://ats-api:3000;
        #     proxy_set_header Host $host;
        #     proxy_set_header X-Real-IP $remote_addr;
        # }
    }
}
