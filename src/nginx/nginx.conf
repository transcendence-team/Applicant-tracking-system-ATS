events
{
    worker_connections 1024;
}

http {
    
    # include       mime.types;
    # default_type  application/octet-stream;

    server
    {
        
        listen 443 ssl;
        server_name localhost;
 
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_certificate /etc/ssl/certs/ats.crt;
        ssl_certificate_key /etc/ssl/private/ats.key;

        location / {
           root /data/www;
        }


    }
}
